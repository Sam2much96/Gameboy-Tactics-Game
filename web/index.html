<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Game fills the full viewport — EmulatorJS handles aspect ratio internally */
        #game-wrapper, #game {
            width: 100%;
            height: 100%;
        }

        /* ── Ad banners: fixed overlays, don't affect game layout ─────────── */
        /* pointer-events:none lets clicks pass through to the emulator when
           no ad content is active. Set to "all" via JS when an ad is showing. */
        .ad-banner {
            position: fixed;
            left: 0;
            right: 0;
            height: 90px;
            background: rgba(0, 0, 0, 0.0);   /* invisible until SDK fills them */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: none;
        }
        .ad-banner.active { pointer-events: all; }

        #ad-banner-top    { top: 0; }
        #ad-banner-bottom { bottom: 0; }

        /* ── Interstitial overlay ─────────────────────────────────────────── */
        #ad-interstitial {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        #ad-interstitial.active { display: flex; }

        #ad-interstitial-inner {
            background: #fff;
            color: #111;
            width: 640px;
            height: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        #ad-skip {
            padding: 10px 28px;
            font-size: 14px;
            cursor: pointer;
            background: #222;
            color: #fff;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Top banner (fixed overlay — doesn't affect game size) -->
    <div class="ad-banner" id="ad-banner-top"></div>

    <!-- Game fills the full viewport -->
    <div id="game-wrapper">
        <div id="game"></div>
    </div>

    <!-- Bottom banner (fixed overlay) -->
    <div class="ad-banner" id="ad-banner-bottom"></div>

    <!-- Interstitial -->
    <div id="ad-interstitial">
        <div id="ad-interstitial-inner">
            <p>Advertisement</p>
            <div id="ad-interstitial-slot" style="width:640px;height:400px;background:#eee;"></div>
            <button id="ad-skip">Play Game</button>
        </div>
    </div>

    <!-- Monetization SDK -->
    <script src="monetization.js"></script>

    <!-- EmulatorJS config -->
    <script>
        EJS_player     = '#game';
        EJS_gameName   = 'My Game';
        EJS_gameUrl    = './my_game.gb';
        EJS_core       = 'gambatte';
        EJS_pathtodata = './emulatorjs/';   /* local bundle — run `make download-emulatorjs` */
        EJS_color      = '#222222';
        EJS_language   = 'en-US';           /* pin locale — avoids 404 on regional variants */

        /* Gambatte core options — classic DMG green palette.
           Change gambatte_gb_internal_palette to one of:
             'GB - DMG'     classic yellow-green
             'GB - Pocket'  grey (Game Boy Pocket)
             'GB - Light'   teal-green (Game Boy Light)
           Or set gambatte_gb_colorization to 'GBC' to use the GBC colour mappings. */
        EJS_defaultOptions = {
            'gambatte_gb_colorization':    'internal',
            'gambatte_gb_internal_palette': 'GB - DMG'
        };

        function startEmulator() {
            var s = document.createElement('script');
            s.src = './emulatorjs/loader.js';
            document.body.appendChild(s);
        }
    </script>

</body>
</html>
